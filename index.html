<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ask AI</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #e6e3dc;
    --panel: #e6e3dc;
    --border: #121212;
    --text: #121212;
    --text-soft: #4a4a45;
    --text-mute: #828282;
    --accent: #d3593f;
    --accent-hover: #b8492f;
    --user-bg: #121212;
    --user-text: #e6e3dc;
    --assistant-bg: #f4f2ec;
    --assistant-border: #121212;
    --input-bg: transparent;
    --input-border: #121212;
    --chip-bg: transparent;
    --chip-hover: #121212;
    --scrollbar: #c9c6bc;
    --scrollbar-thumb: #b5b2a8;
    --scrollbar-thumb-hover: #999689;
    --shadow-color: #121212;
    --font-serif: 'Playfair Display', serif;
    --font-mono: 'Space Mono', monospace;
  }
  html[data-theme="dark"] {
    --bg: #16161a;
    --panel: #16161a;
    --border: #e6e3dc;
    --text: #e6e3dc;
    --text-soft: #b8b5ac;
    --text-mute: #7c7c78;
    --accent: #e8734f;
    --accent-hover: #f08560;
    --user-bg: #e6e3dc;
    --user-text: #121212;
    --assistant-bg: #1f1f24;
    --assistant-border: #e6e3dc;
    --input-bg: transparent;
    --input-border: #e6e3dc;
    --chip-bg: transparent;
    --chip-hover: #e6e3dc;
    --scrollbar: #333;
    --scrollbar-thumb: #3a3a40;
    --scrollbar-thumb-hover: #4a4a52;
    --shadow-color: #e6e3dc;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  html { min-height: 100%; background: var(--bg); }
  html { scrollbar-width: thin; scrollbar-color: var(--scrollbar-thumb) transparent; }
  html::-webkit-scrollbar { width: 8px; }
  html::-webkit-scrollbar-track { background: transparent; }
  html::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 0; }
  html::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-thumb-hover); }
  html::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
  html::-webkit-scrollbar-corner { background: transparent; }

  body {
    font-family: var(--font-mono);
    color: var(--text); background: var(--bg);
    display: flex; flex-direction: column; min-height: 100vh;
    margin: 0 auto; max-width: 900px; width: 100%;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  .stickyTop {
    position: sticky; top: 0; z-index: 10;
    background: var(--panel); transition: background-color 0.2s ease;
  }

  header {
    padding: 1.75rem 2rem; flex-shrink: 0;
    display: flex; flex-direction: column;
    background: var(--panel); transition: background-color 0.2s ease, border-color 0.2s ease;
  }

  .brand-row { display: flex; align-items: center; gap: 1rem; }
  .logo-box {
    width: 40px; height: 40px; flex-shrink: 0;
    background-color: var(--text); color: var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-serif); font-weight: 700; font-size: 1.2rem;
    position: relative;
  }
  .notification-dot {
    position: absolute; top: -4px; right: -4px;
    width: 8px; height: 8px; background-color: var(--accent);
  }
  .brand-text { display: flex; flex-direction: column; font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; }
  .brand-title { font-weight: 700; }
  .brand-subtitle { color: var(--text-mute); }

  #convSize { font-size: 0.68rem; color: var(--text-mute); letter-spacing: 0.03em; }

  .iconBtn, .footerBtn {
    font-size: 0.72rem; padding: 0 14px; height: 34px; cursor: pointer;
    border: 1px solid var(--border); border-radius: 0; background: var(--panel); color: var(--text);
    font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    transition: background-color 0.15s, color 0.15s, transform 0.08s;
  }
  .iconBtn { width: 34px; padding: 0; font-size: 0.95rem; }
  .iconBtn:hover, .footerBtn:hover { background: var(--text); color: var(--bg); }
  .iconBtn:active, .footerBtn:active { transform: scale(0.94); }

  #chatLog {
    flex: 1; padding: 2rem;
    display: flex; flex-direction: column; gap: 18px;
  }

  @keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .msgGroup { display: flex; flex-direction: column; gap: 7px; max-width: 100%; animation: msgIn 0.18s ease-out; }
  .msgGroup.user { align-items: flex-end; }
  .msgGroup.assistant { align-items: flex-start; width: 100%; }

  .msgLabel { font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; }
  .msgLabel.user { color: var(--text-mute); }
  .msgLabel.assistant { color: var(--accent); }

  .msg {
    line-height: 1.7; font-size: 0.95rem;
  }
  .msg.user {
    padding: 12px 18px; max-width: 74%;
    border: 1px solid var(--border); background: transparent; color: var(--text);
  }
  .msg.assistant {
    padding: 0; max-width: 100%; width: 100%;
    border: none; background: transparent; color: var(--text);
  }
  .msg.assistant p { margin: 0 0 10px 0; }
  .msg.assistant p:last-child { margin-bottom: 0; }
  .msg.assistant ul, .msg.assistant ol { margin: 6px 0; padding-left: 22px; }
  .msg.assistant strong { color: var(--accent); }
  .msg.assistant code { background: rgba(128,128,128,0.15); padding: 1px 5px; font-size: 0.9em; }
  .thumbs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .thumb { width: 64px; height: 64px; object-fit: cover; border: 1px solid var(--border); }

  .typingDots { display: inline-flex; gap: 3px; align-items: center; }
  .typingDots span { width: 5px; height: 5px; background: var(--text-mute); animation: blink 1.2s infinite; }
  .typingDots span:nth-child(2) { animation-delay: 0.2s; }
  .typingDots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  #status { color: var(--text-mute); font-size: 0.75rem; padding: 0 2rem; flex-shrink: 0; min-height: 20px; letter-spacing: 0.03em; text-transform: uppercase; }

  #dropZone {
    position: fixed; inset: 0; background: rgba(18,18,18,0.75); color: #e6e3dc;
    display: none; align-items: center; justify-content: center;
    font-family: var(--font-serif); font-style: italic; font-size: 1.6rem; font-weight: 500; z-index: 50; pointer-events: none;
  }
  #dropZone.active { display: flex; }

  #inputBar {
    flex-shrink: 0; padding: 1.25rem 2rem 2rem;
    background: var(--panel); transition: background-color 0.2s ease, border-color 0.2s ease;
    position: sticky; bottom: 0; z-index: 10;
    display: flex; flex-direction: column; gap: 8px;
  }

  .input-wrapper {
    background-color: var(--panel);
    border: 1px solid var(--border);
    padding: 1rem 1.1rem;
  }

  .row { display: flex; flex-direction: column; gap: 0.9rem; }
  textarea {
    flex: 1; font-family: var(--font-mono); font-size: 0.95rem; padding: 0;
    height: 46px; max-height: 140px; resize: none; border-radius: 0;
    border: none; background: var(--input-bg); color: var(--text); outline: none;
    width: 100%;
  }
  textarea::placeholder { color: var(--text-mute); }

  .input-footer {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 0.65rem 0.1rem 0;
    font-size: 0.66rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-mute);
  }
  .keyboard-hint { color: var(--text-mute); flex-shrink: 0; }
  .footer-actions { display: flex; align-items: center; gap: 8px; }

  #attachBtn {
    width: 34px; height: 34px; padding: 0; background: var(--panel); color: var(--text);
    font-size: 1.05rem; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
    cursor: pointer; border-radius: 0; transition: background-color 0.15s, color 0.15s;
  }
  #attachBtn:hover:not(:disabled) { background: var(--text); color: var(--bg); }
  #attachBtn:disabled { opacity: 0.4; cursor: not-allowed; }

  #sendBtn {
    width: 34px; height: 34px; padding: 0; background-color: var(--accent); border: none; color: #fff;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    font-size: 1.05rem; font-weight: 700; border-radius: 0; transition: background-color 0.2s;
  }
  #sendBtn:hover:not(:disabled) { background-color: var(--accent-hover); }
  #sendBtn:disabled { opacity: 0.4; cursor: not-allowed; }

  #pendingFiles { display: flex; gap: 6px; flex-wrap: wrap; }
  #pendingFiles img { width: 48px; height: 48px; object-fit: cover; border: 1px solid var(--border); cursor: pointer; }

  /* ---------- Topic bar (shown once a conversation exists) ---------- */
  #topicBar {
    position: relative;
    margin: 0 2rem;
    padding: 1.5rem 0.5rem 1rem;
    border-bottom: 1px solid var(--border);
  }
  #topicBar .corner { position: absolute; width: 14px; height: 14px; }
  #topicBar .corner-tl { top: 0; left: -0.5rem; border-top: 2px solid var(--border); border-left: 2px solid var(--border); }
  #topicBar .corner-tr { top: 0; right: -0.5rem; border-top: 2px solid var(--border); border-right: 2px solid var(--border); }
  .topicRow {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    font-size: 0.72rem; letter-spacing: 0.05em; text-transform: uppercase;
  }
  #topicText { color: var(--text-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topicVersion { color: var(--text-mute); flex-shrink: 0; }

  /* ---------- Empty state / hero landing ---------- */
  #emptyState { padding: 3rem 2rem 0.5rem; }
  .hero-title {
    font-family: var(--font-serif); font-weight: 500; font-size: 2.6rem; line-height: 1.15;
    letter-spacing: -0.01em; margin: 0 0 1rem 0; color: var(--text);
  }
  .hero-title .highlight { font-style: italic; color: var(--accent); }
  .hero-description { color: var(--text-mute); font-size: 0.85rem; line-height: 1.6; max-width: 520px; margin: 0 0 2rem 0; }
  .chip-container { display: flex; flex-wrap: wrap; gap: 0.6rem; }
  .chip {
    background: transparent; border: 1px solid var(--border); padding: 0.55rem 0.9rem;
    font-family: var(--font-mono); font-size: 0.78rem; color: var(--text); cursor: pointer;
    transition: background-color 0.15s, color 0.15s;
  }
  .chip:hover { background: var(--text); color: var(--bg); }
</style>
</head>
<body>

  <div class="stickyTop">
    <header>
      <div class="brand-row">
        <div class="logo-box">A<div class="notification-dot"></div></div>
        <div class="brand-text">
          <span class="brand-title">ASK AI</span>
          <span class="brand-subtitle" id="convSize">STUDY BUDDY · ONLINE</span>
        </div>
      </div>
    </header>

    <div id="topicBar" style="display:none;">
      <span class="corner corner-tl"></span>
      <span class="corner corner-tr"></span>
      <div class="topicRow">
        <span id="topicText">//</span>
        <span class="topicVersion">V0.1 // GROUNDED</span>
      </div>
    </div>
  </div>

  <div id="emptyState" style="display:none;">
    <h1 class="hero-title">What would you like to <span class="highlight">learn</span> today?</h1>
    <p class="hero-description">Ask a question and get a clear, worked answer — with reasoning shown, math rendered inline, and a PDF export when you want to keep it.</p>
    <div class="chip-container">
      <button class="chip" onclick="askChip('Explain this concept step by step')">Explain this concept step by step</button>
      <button class="chip" onclick="askChip('Help me solve a practice problem')">Help me solve a practice problem</button>
      <button class="chip" onclick="askChip('Summarize this topic for me')">Summarize this topic for me</button>
      <button class="chip" onclick="askChip('Turn this into a study PDF')">Turn this into a study PDF</button>
    </div>
  </div>

  <div id="chatLog"></div>
  <div id="status"></div>

  <div id="inputBar">
    <div id="pendingFiles"></div>
    <div class="input-wrapper">
      <div class="row">
        <textarea id="question" placeholder="Ask the AI anything..."></textarea>
      </div>
    </div>
    <div class="input-footer">
      <span class="keyboard-hint">ENTER · SEND // SHIFT+ENTER · NEW LINE</span>
      <div class="footer-actions">
        <button class="iconBtn" id="themeToggle" title="Toggle dark mode">🌙</button>
        <button class="footerBtn" onclick="clearHistory()">Clear chat</button>
        <button id="attachBtn" onclick="document.getElementById('imageFile').click()" title="Attach image or PDF">📎</button>
        <button id="sendBtn" onclick="sendMessage()" aria-label="Send query">↑</button>
      </div>
    </div>
    <input type="file" id="imageFile" accept="image/*,application/pdf" multiple style="display:none">
  </div>

  <div id="dropZone">Drop image or PDF to ask about it</div>

  <script>
    const API_BASE = "http://127.0.0.1:8000";
    const STORAGE_KEY = "ai_qa_history_v2";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    marked.setOptions({ breaks: true });

    // Full conversation, kept forever until "Clear chat".
    // Each item: { role: "user"|"assistant", content: string | Array<part> }
    // where a part is {type:"text", text} or {type:"image_url", image_url:{url}}.
    // Images are stored as real base64 data URLs so later text-only follow-ups
    // (e.g. "next slide") still have full access to earlier pages/photos.
    let history = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

    let pendingImages = []; // [{name, dataUrl}] staged before sending

    function saveHistory() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
      updateConvSize();
    }

    function updateConvSize() {
      const kb = Math.round(JSON.stringify(history).length / 1024);
      document.getElementById("convSize").textContent =
        history.length ? `${history.length} MESSAGES · ~${kb} KB STORED` : "STUDY BUDDY · ONLINE";
    }

    function clearHistory() {
      if (history.length && !confirm("Clear the whole conversation? This can't be undone.")) return;
      history = [];
      saveHistory();
      renderChat();
    }

    // ---------- Rendering ----------

    function extractMath(text) {
      const store = [];
      function stash(latex, displayMode) {
        const token = `@@MATH${store.length}@@`;
        store.push({ latex, displayMode });
        return token;
      }
      const replaced = text
        .replace(/\$\$([\s\S]+?)\$\$/g, (_, latex) => stash(latex, true))
        .replace(/\\\[([\s\S]+?)\\\]/g, (_, latex) => stash(latex, true))
        .replace(/\\\(([\s\S]+?)\\\)/g, (_, latex) => stash(latex, false))
        .replace(/\$([^\$\n]+?)\$/g, (_, latex) => stash(latex, false));
      return { replaced, store };
    }

    function renderMarkdownMath(text) {
      const { replaced, store } = extractMath(text);
      const rawHtml = marked.parse(replaced);
      const clean = DOMPurify.sanitize(rawHtml);
      const wrapper = document.createElement("div");
      wrapper.innerHTML = clean;
      wrapper.innerHTML = wrapper.innerHTML.replace(/@@MATH(\d+)@@/g, (_, i) => {
        const { latex, displayMode } = store[Number(i)];
        try {
          return katex.renderToString(latex.trim(), { displayMode, throwOnError: false });
        } catch (e) {
          return latex;
        }
      });
      return wrapper;
    }

    function contentToText(content) {
      if (typeof content === "string") return content;
      return content.filter(p => p.type === "text").map(p => p.text).join(" ");
    }

    function contentImages(content) {
      if (typeof content === "string") return [];
      return content.filter(p => p.type === "image_url").map(p => p.image_url.url);
    }

    function truncate(text, max) {
      text = text.trim().replace(/\s+/g, " ");
      return text.length > max ? text.slice(0, max).trim() + "…" : text;
    }

    function updateViewState() {
      const empty = history.length === 0;
      document.getElementById("emptyState").style.display = empty ? "block" : "none";
      document.getElementById("topicBar").style.display = empty ? "none" : "block";
      document.getElementById("chatLog").style.display = empty ? "none" : "flex";
      if (!empty) {
        const firstUser = history.find(m => m.role === "user");
        const topic = firstUser ? truncate(contentToText(firstUser.content), 60) : "";
        document.getElementById("topicText").textContent = "// " + topic.toUpperCase();
      }
    }

    function askChip(text) {
      const box = document.getElementById("question");
      box.value = text;
      sendMessage();
    }

    function renderChat() {
      const log = document.getElementById("chatLog");
      log.innerHTML = "";
      history.forEach(msg => {
        const isUser = msg.role === "user";

        const group = document.createElement("div");
        group.className = "msgGroup " + (isUser ? "user" : "assistant");

        const label = document.createElement("div");
        label.className = "msgLabel " + (isUser ? "user" : "assistant");
        label.textContent = isUser ? "YOU" : "ASK AI";
        group.appendChild(label);

        const div = document.createElement("div");
        div.className = "msg " + (isUser ? "user" : "assistant");

        if (!isUser) {
          div.appendChild(renderMarkdownMath(contentToText(msg.content)));
        } else {
          const text = contentToText(msg.content);
          if (text) {
            const p = document.createElement("div");
            p.textContent = text;
            div.appendChild(p);
          }
          const images = contentImages(msg.content);
          if (images.length) {
            const thumbs = document.createElement("div");
            thumbs.className = "thumbs";
            images.forEach(url => {
              const img = document.createElement("img");
              img.src = url;
              img.className = "thumb";
              thumbs.appendChild(img);
            });
            div.appendChild(thumbs);
          }
        }
        group.appendChild(div);
        log.appendChild(group);
      });
      updateViewState();
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
      updateConvSize();
    }

    function setStatus(text) {
      document.getElementById("status").textContent = text;
    }

    function setBusy(busy) {
      document.getElementById("sendBtn").disabled = busy;
      document.getElementById("attachBtn").disabled = busy;
      document.getElementById("question").disabled = busy;
    }

    document.getElementById("question").addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    document.getElementById("question").addEventListener("input", function () {
      this.style.height = "46px";
      this.style.height = Math.min(this.scrollHeight, 140) + "px";
    });

    // ---------- Sending ----------

    async function sendConversation() {
      setBusy(true);
      setStatus("Thinking...");
      try {
        const res = await fetch(`${API_BASE}/ask`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history }),
        });
        const data = await res.json();
        history.push({ role: "assistant", content: data.answer || JSON.stringify(data) });
      } catch (err) {
        history.push({ role: "assistant", content: "Error: " + err.message });
      }
      saveHistory();
      renderChat();
      setStatus("");
      setBusy(false);
    }

    function sendMessage() {
      const box = document.getElementById("question");
      const text = box.value.trim();
      if (!text && !pendingImages.length) return; // nothing to send

      let content;
      if (pendingImages.length) {
        // Text + image(s)/PDF pages together as one turn.
        const parts = [];
        parts.push({ type: "text", text: text || "Read the question in these image(s) and answer it." });
        pendingImages.forEach(img => parts.push({ type: "image_url", image_url: { url: img.dataUrl } }));
        content = parts;
      } else {
        // Text only -> plain string, backend routes this to the text model.
        content = text;
      }

      history.push({ role: "user", content });
      box.value = "";
      box.style.height = "46px";
      pendingImages = [];
      renderPendingFiles();
      renderChat();
      saveHistory();
      sendConversation();
    }

    // ---------- Image / PDF staging ----------

    function renderPendingFiles() {
      const box = document.getElementById("pendingFiles");
      box.innerHTML = "";
      pendingImages.forEach((img, i) => {
        const el = document.createElement("img");
        el.src = img.dataUrl;
        el.title = img.name + " (click to remove)";
        el.onclick = () => { pendingImages.splice(i, 1); renderPendingFiles(); };
        box.appendChild(el);
      });
    }

    async function pdfToImages(file) {
      const buf = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
      const images = [];
      for (let p = 1; p <= pdf.numPages; p++) {
        const page = await pdf.getPage(p);
        const viewport = page.getViewport({ scale: 2 });
        const canvas = document.createElement("canvas");
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
        images.push({ name: `${file.name} p${p}`, dataUrl: canvas.toDataURL("image/png") });
      }
      return images;
    }

    async function handleIncomingFiles(fileList) {
      for (const file of fileList) {
        if (file.type === "application/pdf") {
          setStatus(`Converting ${file.name} to images...`);
          const pages = await pdfToImages(file);
          pendingImages.push(...pages);
        } else if (file.type.startsWith("image/")) {
          const dataUrl = await new Promise(res => {
            const reader = new FileReader();
            reader.onload = () => res(reader.result);
            reader.readAsDataURL(file);
          });
          pendingImages.push({ name: file.name, dataUrl });
        }
      }
      setStatus("");
      renderPendingFiles();
    }

    document.getElementById("imageFile").addEventListener("change", e => {
      handleIncomingFiles(e.target.files);
      e.target.value = "";
    });

    // ---------- Drag & drop ----------
    const dropZone = document.getElementById("dropZone");
    let dragCounter = 0;
    window.addEventListener("dragenter", e => { e.preventDefault(); dragCounter++; dropZone.classList.add("active"); });
    window.addEventListener("dragover", e => e.preventDefault());
    window.addEventListener("dragleave", () => { dragCounter--; if (dragCounter <= 0) { dragCounter = 0; dropZone.classList.remove("active"); } });
    window.addEventListener("drop", e => {
      e.preventDefault();
      dragCounter = 0;
      dropZone.classList.remove("active");
      if (e.dataTransfer.files.length) handleIncomingFiles(e.dataTransfer.files);
    });

    // ---------- Paste from clipboard ----------
    window.addEventListener("paste", e => {
      const files = [];
      for (const item of e.clipboardData.items) {
        if (item.kind === "file") {
          const f = item.getAsFile();
          if (f) files.push(f);
        }
      }
      if (files.length) handleIncomingFiles(files);
    });

    // ---------- Dark mode ----------
    const THEME_KEY = "ai_qa_theme";
    const themeToggle = document.getElementById("themeToggle");

    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      themeToggle.textContent = theme === "dark" ? "☀️" : "🌙";
    }

    const savedTheme = localStorage.getItem(THEME_KEY)
      || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    applyTheme(savedTheme);

    themeToggle.addEventListener("click", () => {
      const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      applyTheme(next);
      localStorage.setItem(THEME_KEY, next);
    });

    renderChat();
  </script>
</body>
</html>
